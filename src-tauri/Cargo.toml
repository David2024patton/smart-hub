[package]
name = "smart-hub"
version = "0.1.0"
description = "The Sovereign AI Orchestration OS - Rust Core Backend"
authors = ["Smart Hub Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-all", "fs-all", "path-all", "process-all", "window-all", "dialog-all"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "json", "macros", "migrate"], optional = true }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
thiserror = "1.0"
anyhow = "1.0"
portable-pty = "0.9"
notify = "6.1"
once_cell = "1.19"
regex = "1.10"
lazy_static = "1.4"
base64 = "0.22"

[features]
default = ["custom-protocol", "database"]
custom-protocol = ["tauri/custom-protocol"]
database = ["sqlx"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
